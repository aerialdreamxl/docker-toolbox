[program:hermes-dashboard-proxy]
command=/bin/bash -c "socat TCP-LISTEN:9119,bind=0.0.0.0,reuseaddr,fork TCP:127.0.0.1:6767"
directory=/home/ubuntu
user=root
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/hermes-dashboard-proxy.log
stderr_logfile=/var/log/supervisor/hermes-dashboard-proxy.log
